# Horizon for RUNTIME=host: runs in a container from the backend image on the host
# network (reaches loopback Postgres/Redis/MinIO), sharing the env's .env and storage.
#   PROJECT_SLUG, DP_ENV, ENV_FILE, BACKEND_IMAGE, STORAGE_DIR, DP_UID, DP_GID

name: ${PROJECT_SLUG:?}-${DP_ENV:?}-horizon

services:
  horizon:
    image: ${BACKEND_IMAGE:?}
    restart: unless-stopped
    network_mode: host
    # Run as the deploy user so it can write the host-owned storage dir.
    user: "${DP_UID:?}:${DP_GID:?}"
    command: php artisan horizon
    stop_grace_period: 60s
    env_file:
      - ${ENV_FILE:?}
    environment:
      CACHE_CONFIG: "0"
      RUN_MIGRATIONS: "0"
    volumes:
      - ${STORAGE_DIR:?}:/var/www/html/storage
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    deploy: { resources: { limits: { memory: "${HORIZON_MEM_LIMIT:-512M}" } } }
